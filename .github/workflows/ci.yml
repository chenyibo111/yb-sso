name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sso_test
          POSTGRES_PASSWORD: sso_test
          POSTGRES_DB: sso_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sso_test -d sso_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://sso_test:sso_test@127.0.0.1:5432/sso_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o "$RUNNER_TEMP/sso" ./cmd/sso
